<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 2: Manipulate SVG</title>
  <style>
    body { margin: 0; display: flex; gap: 20px; padding: 20px; font-family: system-ui, sans-serif; background: #f5f5f5; }
    .info { max-width: 300px; }
    h2 { margin-top: 0; }
    canvas { border: 1px solid #ccc; background: white; }
  </style>
</head>
<body>
  <div id="sketch-holder"></div>
  <div class="info">
    <h2>Manipulate Loaded SVG</h2>
    <p>Loads <code>shapes.svg</code> then draws it 4 times with different transforms: original, scaled 2x, rotated 45deg, and translated + mirrored.</p>
    <p>This works because <code>drawSVG()</code> now uses p5's <code>beginShape()</code>/<code>vertex()</code>/<code>endShape()</code> — p5's own transforms apply on top.</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.0.0/lib/p5.min.js"></script>
  <script type="module">
    import p5SVGImport from '../../dist/p5.svg-import.esm.js';
    p5.registerAddon(p5SVGImport);

    let svgShapes = null;

    const sketch = (p) => {
      p.setup = () => {
        p.createCanvas(600, 400);
        p.noLoop();
        p.loadSVG('shapes.svg').then(s => { svgShapes = s; p.redraw(); });
      };

      p.draw = () => {
        p.background(255);

        if (!svgShapes) return;

        // Original
        p.push();
        p.drawSVG(svgShapes);
        p.pop();

        // Scaled 2x
        p.push();
        p.translate(250, 20);
        p.scale(2);
        p.drawSVG(svgShapes);
        p.pop();

        // Rotated 45deg
        p.push();
        p.translate(120, 320);
        p.rotate(p.PI / 4);
        p.drawSVG(svgShapes);
        p.pop();

        // Translated + flipped horizontally
        p.push();
        p.translate(400, 300);
        p.scale(-1, 1);
        p.drawSVG(svgShapes);
        p.pop();
      };
    };

    new p5(sketch, 'sketch-holder');
  </script>
</body>
</html>

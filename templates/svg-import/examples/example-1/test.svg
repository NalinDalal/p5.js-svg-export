<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Rectangle -->
  <rect x="20" y="20" width="120" height="80" fill="#4A90D9" stroke="#2C5F8A" stroke-width="2"/>

  <!-- Rounded rectangle -->
  <rect x="160" y="20" width="120" height="80" rx="15" ry="15" fill="#E67E22" stroke="#D35400" stroke-width="2"/>

  <!-- Circle -->
  <circle cx="350" cy="60" r="40" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>

  <!-- Ellipse -->
  <ellipse cx="80" cy="180" rx="60" ry="35" fill="#8E44AD" stroke="#6C3483" stroke-width="2"/>

  <!-- Line -->
  <line x1="160" y1="140" x2="380" y2="220" stroke="#E74C3C" stroke-width="3"/>

  <!-- Polyline -->
  <polyline points="20,260 60,230 100,270 140,220 180,260" fill="none" stroke="#F39C12" stroke-width="2"/>

  <!-- Polygon -->
  <polygon points="280,150 320,210 360,150 340,220 300,220" fill="#1ABC9C" stroke="#16A085" stroke-width="2"/>

  <!-- Path: simple shape -->
  <path d="M 20 320 L 80 320 L 80 380 L 20 380 Z" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>

  <!-- Path: triangle -->
  <path d="M 120 320 L 180 380 L 60 380 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>

  <!-- Path: curve -->
  <path d="M 200 320 C 220 280 280 280 300 320 C 320 360 380 360 400 320" fill="none" stroke="#9B59B6" stroke-width="3"/>

  <!-- Group with transform -->
  <g transform="translate(220, 300)">
    <rect x="0" y="0" width="60" height="60" fill="#F1C40F" stroke="#F39C12" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#E67E22" stroke="#D35400" stroke-width="1"/>
  </g>
</svg>
